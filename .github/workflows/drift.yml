name: drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install scanner dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: google-github-actions/auth@v3
        if: vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' && vars.DRIFT_SCOPE != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Live scan
        id: scan
        if: vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' && vars.DRIFT_SCOPE != ''
        env:
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          python -m drift_scanner.cli --scope "${{ vars.DRIFT_SCOPE }}" --format json --output drift.json
          python -m drift_scanner.cli --scope "${{ vars.DRIFT_SCOPE }}" --format html --output drift.html
          python -m drift_scanner.cli --scope "${{ vars.DRIFT_SCOPE }}" --format md --output drift.md
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Skip live scan
        if: vars.WIF_PROVIDER == '' || vars.WIF_SERVICE_ACCOUNT == '' || vars.DRIFT_SCOPE == ''
        run: echo "WIF_PROVIDER, WIF_SERVICE_ACCOUNT, or DRIFT_SCOPE is unset. Live drift scan skipped. Offline mode is make drift."
      - uses: actions/upload-artifact@v4
        if: steps.scan.outputs.ran == 'true'
        with:
          name: drift-report
          path: |
            drift.json
            drift.html
            drift.md
          retention-days: 30
      - name: Open or update a drift issue
        if: steps.scan.outputs.ran == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('drift.json', 'utf8'));
            const findings = report.findings || [];
            if (findings.length === 0) {
              core.info('No drift findings.');
              return;
            }
            const title = 'Drift scan findings';
            const body = [
              `Scope \`${report.scope}\` at ${report.generated_at}.`,
              '',
              `Findings: ${report.summary.total}. Preventive gaps: ${report.summary.preventive_gaps}.`,
              '',
              '```json',
              JSON.stringify(findings.slice(0, 20), null, 2),
              '```',
              '',
              'Full report is the drift-report artifact on this workflow run.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });
            const issue = existing.data.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['drift'],
            });
